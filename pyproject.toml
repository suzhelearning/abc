[project]
name = "abc-minimal"
version = "0.1.0"
description = "Minimal end-to-end release for the abc dataset and the ABC-DiT (LBM) policy."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "h5py",
    "pyyaml",
    "scipy",
    "osqp",
    "nlopt",
    "pin",
    "coacd",
    "trimesh",
    # trimesh uses the spatial index for bounded collision-quality distance checks.
    "rtree",
    "eclipse-zenoh==1.10.0",
    "torch==2.11.0+cu128",
    "torchcodec==0.11.0+cpu",
    "mujoco",
    "mujoco-warp",
    "warp-lang",
    "mjviser",
    "viser",
    "imageio[ffmpeg]",
    "ftfy",
    "regex",
    # tyro powers the dataclass CLI configs.
    "tyro",
    # mcap-protobuf-support already pulls in mcap, but list it explicitly
    # so users who only run export_mcap.py see the dep up front.
    "mcap",
    "mcap-protobuf-support",
    # Optional: W&B logging in train.py (off by default; --log-wandb to enable).
    "wandb",
]

[project.scripts]
spd-train = "spd_vr.training:main"
spd-model = "spd_vr.model_compiler.cli:main"
spd-model-builder = "spd_vr.model_builder:main"
spd-validate-episode = "spd_vr.data:main"
spd-filter-contacts = "spd_vr.filter_contacts:main"
spd-replay-episode = "spd_vr.replay:main"
spd-scene = "spd_vr.scenes.cli:main"
spd-pico-bridge = "spd_vr.pxrea_bridge:main"
spd-arm-ik = "spd_vr.arm_ik:main"
spd-viewer = "spd_vr.viewer:main"
spd-control = "spd_vr.control_cli:main"
spd-vr-live = "spd_vr.live:main"
spd-vr-preflight = "spd_vr.preflight:main"
spd-vr-acceptance = "spd_vr.acceptance:main"
spd-vr-dataset-audit = "spd_vr.collection:main"
spd-sim-benchmark = "spd_vr.simulation:benchmark_main"
spd-policy-benchmark = "spd_vr.policy_benchmark:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["abc_minimal*", "spd_vr*", "wuji_retargeting*"]
exclude = ["wuji_retargeting.wuji-description*"]

[tool.setuptools.package-data]
spd_vr = ["config/*.yaml"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchcodec = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
