optimizer:
  type: AdaptiveOptimizerAnalytical
  urdf_path: ../../assets/tianji_wuji2/tianji_wuji2.urdf
  active_joint_names:
    [l_thumb_cmc_flex, l_thumb_cmc_abd, l_thumb_mcp, l_thumb_ip,
     l_index_finger_mcp_flex, l_index_finger_mcp_abd, l_index_finger_pip, l_index_finger_dip,
     l_middle_finger_mcp_flex, l_middle_finger_mcp_abd, l_middle_finger_pip, l_middle_finger_dip,
     l_ring_finger_mcp_flex, l_ring_finger_mcp_abd, l_ring_finger_pip, l_ring_finger_dip,
     l_pinky_mcp_flex, l_pinky_mcp_abd, l_pinky_pip, l_pinky_dip]
  link_naming:
    {prefix: l_, palm: wrist, fingers: [thumb, index_finger, middle_finger, ring_finger, pinky],
     pip: "{finger}_middle", dip: "{finger}_distal", tip: "{finger}_tip", link1: "{finger}_proximal_abd"}
retarget:
  {huber_delta: 2.0, huber_delta_dir: 0.5, norm_delta: 0.04, w_pos: 1.0,
   w_dir: 2.0, scaling: 1.0, w_full_hand: 1.0, thumb_skip_pip: false,
   w_hyper: 1.0, soft_min: 0.0, w_couple: 0.1, couple_ratio: 0.7, lp_alpha: 0.2}
